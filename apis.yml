aid: primodium-inc
name: Primodium Inc.
description: >-
  Primodium Inc. (primodiumxyz) is a developer-focused studio building fully
  on-chain applications and games on Ethereum and Solana. It ships two on-chain
  games — Primodium, a space-based factory-building game, and Primodium: Empires,
  a turn-based prediction-market game — both built with MUD and Phaser, alongside
  a suite of open-source developer libraries and infrastructure: Reactive Tables
  (a strictly-typed reactive table library for MUD apps), a Solana DEX Indexer
  Stack exposing a GraphQL API over Hasura/Timescale, a tRPC transaction-sponsoring
  DEX server, an off-chain MUD indexer, and gasless-transaction relayers. All
  tooling is published open-source under the MIT license via the primodiumxyz
  GitHub organization and the @primodiumxyz npm scope.
